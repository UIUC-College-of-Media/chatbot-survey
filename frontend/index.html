<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Condition Chat Demo</title>
    <style>
      :root {
        --bg: #f1efe7;
        --panel: #fcfaf3;
        --line: #d6d0be;
        --ink: #1f1c16;
        --muted: #666053;
        --accent: #1f6f78;
        --accent-2: #c4552d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 8%, #efe4cb 0, transparent 32%),
          radial-gradient(circle at 90% 90%, #d6ecef 0, transparent 36%),
          var(--bg);
      }
      .shell { width: min(1100px, 100%); margin: 0 auto; padding: 16px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 12px 34px rgba(20, 20, 20, 0.08);
        overflow: hidden;
      }
      .header {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(110deg, rgba(31, 111, 120, 0.08), rgba(196, 85, 45, 0.08));
      }
      .header h1 { margin: 0; font-size: 20px; }
      .header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
      .hidden { display: none; }
      .setup, .workspace { padding: 16px; }
      .grid { display: grid; gap: 10px; }
      .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
      input, select, textarea, button {
        font: inherit;
        border-radius: 10px;
        border: 1px solid var(--line);
        padding: 10px 12px;
        width: 100%;
        background: #fff;
      }
      textarea { min-height: 84px; resize: vertical; }
      button {
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        border-color: transparent;
        font-weight: 600;
      }
      button.secondary { background: #fff; color: var(--ink); border-color: var(--line); }
      button.warn { background: var(--accent-2); }
      button[disabled], input[disabled], textarea[disabled], select[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .workspace-layout {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 12px;
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.7);
      }
      .panel .section { padding: 12px; border-bottom: 1px solid var(--line); }
      .panel .section:last-child { border-bottom: 0; }
      .session-list { display: grid; gap: 8px; }
      .session-btn {
        text-align: left;
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .session-btn.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
      .messages {
        height: 52vh;
        min-height: 300px;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg {
        max-width: 85%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px;
        white-space: pre-wrap;
      }
      .msg.user { align-self: flex-end; background: rgba(31, 111, 120, 0.08); }
      .msg.assistant { align-self: flex-start; background: rgba(196, 85, 45, 0.08); }
      .status { min-height: 18px; color: var(--muted); font-size: 12px; padding: 0 12px 8px; }
      .error { color: #8f1d1d; }
      .composer { padding: 10px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
      .composer-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
      @media (max-width: 900px) {
        .workspace-layout { grid-template-columns: 1fr; }
        .grid.two, .composer-row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="header">
          <h1>Condition Chat Demo</h1>
          <p id="headerMeta"></p>
        </div>

        <section class="setup hidden" id="setupView">
          <h2>Choose One Condition</h2>
          <p>Submit one condition to start. You will be redirected to chat with <code>participant_id=participant-123</code>.</p>
          <div class="grid two">
            <div>
              <label for="setupCondition">Condition</label>
              <select id="setupCondition"></select>
            </div>
            <div>
              <label for="setupUserAnswer">user_answer (1-6)</label>
              <input id="setupUserAnswer" type="number" min="1" max="6" />
            </div>
          </div>
          <div style="margin-top:10px;">
            <label for="setupArgument">argument</label>
            <textarea id="setupArgument" placeholder="Required for personalized conditions"></textarea>
          </div>
          <div style="margin-top:12px; display:flex; gap:10px;">
            <button id="setupStartBtn">Initialize and Go to Chat</button>
          </div>
          <div class="status" id="setupStatus"></div>
        </section>

        <section class="workspace hidden" id="chatView">
          <div class="workspace-layout">
            <aside class="panel">
              <div class="section">
                <strong>Navigation</strong>
                <div style="margin-top:8px;">
                  <button type="button" class="secondary" id="backHomeBtn">Back to Home</button>
                </div>
              </div>
              <div class="section">
                <strong>Initialized Conditions</strong>
                <div class="session-list" id="sessionList" style="margin-top:8px;"></div>
              </div>
            </aside>

            <main class="panel">
              <div class="section" id="activeMeta">No active condition selected.</div>
              <div class="messages" id="messages"></div>
              <div class="status" id="chatStatus"></div>
              <form class="composer" id="composer">
                <textarea id="chatInput" placeholder="Type your message"></textarea>
                <div class="composer-row">
                  <button type="submit" id="sendBtn">Send</button>
                  <button type="button" class="warn" id="clearBtn">Clear Condition Chat</button>
                  <button type="button" class="secondary" id="copyLinkBtn">Copy URL</button>
                </div>
              </form>
            </main>
          </div>
        </section>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const participantId = (params.get("participant_id") || "").trim();
      const apiBase = "";
      const redirectDefaultParticipant = "participant-123";

      const setupView = document.getElementById("setupView");
      const chatView = document.getElementById("chatView");
      const headerMeta = document.getElementById("headerMeta");

      const setupCondition = document.getElementById("setupCondition");
      const setupUserAnswer = document.getElementById("setupUserAnswer");
      const setupArgument = document.getElementById("setupArgument");
      const setupStartBtn = document.getElementById("setupStartBtn");
      const setupStatus = document.getElementById("setupStatus");

      const backHomeBtn = document.getElementById("backHomeBtn");
      const sessionList = document.getElementById("sessionList");
      const activeMeta = document.getElementById("activeMeta");
      const messages = document.getElementById("messages");
      const chatStatus = document.getElementById("chatStatus");
      const composer = document.getElementById("composer");
      const chatInput = document.getElementById("chatInput");
      const sendBtn = document.getElementById("sendBtn");
      const clearBtn = document.getElementById("clearBtn");
      const copyLinkBtn = document.getElementById("copyLinkBtn");

      let conditions = [];
      let sessions = [];
      let activeConditionKey = (params.get("condition_key") || "").trim();
      let sending = false;

      function setStatus(el, text, isError = false) {
        el.textContent = text;
        el.classList.toggle("error", isError);
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function selectedDefinition(key) {
        return conditions.find((c) => c.key === key);
      }

      function applyConditionalInputs(conditionKey, answerEl, argumentEl) {
        const def = selectedDefinition(conditionKey);
        if (!def) return;
        answerEl.disabled = !def.requires_user_answer;
        argumentEl.disabled = !def.requires_argument;
        if (!def.requires_user_answer) answerEl.value = "";
        if (!def.requires_argument) argumentEl.value = "";
      }

      async function fetchJson(path, options = {}) {
        const response = await fetch(`${apiBase}${path}`, options);
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || "Request failed");
        return body;
      }

      function renderConditionOptions(selectEl) {
        selectEl.innerHTML = conditions
          .map((c) => `<option value="${c.key}">${c.label}</option>`)
          .join("");
      }

      function renderMessages(data) {
        if (!data || data.length === 0) {
          messages.innerHTML = "<div>No messages yet.</div>";
          return;
        }
        messages.innerHTML = data
          .map((m) => `<div class="msg ${m.role}"><strong>${m.role}</strong><br>${escapeHtml(m.content)}</div>`)
          .join("");
        messages.scrollTop = messages.scrollHeight;
      }

      function renderSessionList() {
        if (!sessions.length) {
          sessionList.innerHTML = "<div>No condition chat initialized yet.</div>";
          return;
        }
        sessionList.innerHTML = sessions
          .map((s) => `<button class="session-btn ${s.condition_key === activeConditionKey ? "active" : ""}" data-key="${s.condition_key}">${s.condition_label}</button>`)
          .join("");
      }

      async function loadConditions() {
        const body = await fetchJson("/api/v1/chat/conditions");
        conditions = body.conditions || [];
        renderConditionOptions(setupCondition);
        if (conditions.length) {
          if (!activeConditionKey) activeConditionKey = conditions[0].key;
          setupCondition.value = conditions[0].key;
          applyConditionalInputs(setupCondition.value, setupUserAnswer, setupArgument);
        }
      }

      async function initializeCondition(pid, conditionKey, userAnswer, argument) {
        const payload = { participant_id: pid, condition_key: conditionKey };
        if (userAnswer) payload.user_answer = Number(userAnswer);
        if (argument) payload.argument = argument;
        return fetchJson("/api/v1/chat/initialize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      }

      async function loadSessions() {
        const body = await fetchJson(`/api/v1/chat/sessions/${encodeURIComponent(participantId)}`);
        sessions = body.sessions || [];
        if (!activeConditionKey && sessions.length) activeConditionKey = sessions[0].condition_key;
        renderSessionList();
      }

      async function loadActiveHistory() {
        if (!activeConditionKey) {
          activeMeta.textContent = "No active condition selected.";
          renderMessages([]);
          return;
        }
        try {
          const body = await fetchJson(`/api/v1/chat/history/${encodeURIComponent(participantId)}/${encodeURIComponent(activeConditionKey)}`);
          activeMeta.textContent = `${body.condition_label} | Topic: ${body.topic}`;
          renderMessages(body.messages || []);
          setStatus(chatStatus, "");
        } catch (err) {
          renderMessages([]);
          setStatus(chatStatus, String(err.message || err), true);
        }
      }

      async function onSetupStart() {
        setStatus(setupStatus, "Initializing condition chat...");
        setupStartBtn.disabled = true;
        try {
          const conditionKey = setupCondition.value;
          await initializeCondition(
            redirectDefaultParticipant,
            conditionKey,
            setupUserAnswer.value.trim(),
            setupArgument.value.trim()
          );
          const url = new URL(window.location.href);
          url.search = `?participant_id=${encodeURIComponent(redirectDefaultParticipant)}&condition_key=${encodeURIComponent(conditionKey)}`;
          window.location.href = url.toString();
        } catch (err) {
          setStatus(setupStatus, String(err.message || err), true);
          setupStartBtn.disabled = false;
        }
      }

      async function onSend(event) {
        event.preventDefault();
        if (sending || !activeConditionKey) return;
        const text = chatInput.value.trim();
        if (!text) return;

        sending = true;
        sendBtn.disabled = true;
        setStatus(chatStatus, "Waiting for assistant reply...");
        try {
          const body = await fetchJson("/api/v1/chat/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              participant_id: participantId,
              condition_key: activeConditionKey,
              message: text
            })
          });
          renderMessages(body.messages || []);
          chatInput.value = "";
          await loadSessions();
          setStatus(chatStatus, "");
        } catch (err) {
          setStatus(chatStatus, String(err.message || err), true);
        } finally {
          sending = false;
          sendBtn.disabled = false;
        }
      }

      async function onClear() {
        if (!activeConditionKey) return;
        clearBtn.disabled = true;
        setStatus(chatStatus, "Clearing condition chat...");
        try {
          const body = await fetchJson(`/api/v1/chat/reset/${encodeURIComponent(participantId)}/${encodeURIComponent(activeConditionKey)}`, {
            method: "POST"
          });
          renderMessages(body.messages || []);
          await loadSessions();
          setStatus(chatStatus, "");
        } catch (err) {
          setStatus(chatStatus, String(err.message || err), true);
        } finally {
          clearBtn.disabled = false;
        }
      }

      function attachListeners() {
        setupCondition.addEventListener("change", () => {
          applyConditionalInputs(setupCondition.value, setupUserAnswer, setupArgument);
        });
        setupStartBtn.addEventListener("click", onSetupStart);
        backHomeBtn.addEventListener("click", () => {
          const url = new URL(window.location.href);
          url.search = "";
          window.location.href = url.toString();
        });
        composer.addEventListener("submit", onSend);
        clearBtn.addEventListener("click", onClear);
        copyLinkBtn.addEventListener("click", async () => {
          await navigator.clipboard.writeText(window.location.href);
          setStatus(chatStatus, "URL copied.");
        });
        sessionList.addEventListener("click", async (event) => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;
          if (!target.matches("button[data-key]")) return;
          activeConditionKey = target.getAttribute("data-key") || "";
          renderSessionList();
          await loadActiveHistory();
          const url = new URL(window.location.href);
          url.searchParams.set("condition_key", activeConditionKey);
          history.replaceState({}, "", url.toString());
        });
      }

      async function main() {
        try {
          await loadConditions();
        } catch (err) {
          headerMeta.textContent = `Failed to load conditions: ${String(err.message || err)}`;
          return;
        }

        attachListeners();

        if (!participantId) {
          setupView.classList.remove("hidden");
          headerMeta.textContent = "Setup mode: choose one condition to initialize chat";
          return;
        }

        setupView.classList.add("hidden");
        chatView.classList.remove("hidden");
        headerMeta.textContent = `participant_id=${participantId}`;

        await loadSessions();
        if (activeConditionKey && !sessions.find((s) => s.condition_key === activeConditionKey)) {
          activeConditionKey = sessions.length ? sessions[0].condition_key : "";
        }
        renderSessionList();
        await loadActiveHistory();
      }

      main();
    </script>
  </body>
</html>
