limit_req_zone $binary_remote_addr zone=chat_send:10m rate=30r/m;

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/chat/stream {
        limit_req zone=chat_send;
        proxy_pass http://backend:8000/api/v1/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        add_header Content-Security-Policy "frame-ancestors https://illinois.qualtrics.com";
        try_files $uri $uri/ /index.html;
    }
}
