apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatbot-survey-ingress
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - chatbot-survey.example.com
      secretName: chatbot-survey-tls
  rules:
    - host: chatbot-survey.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
