name: Build Images and Release Helm Chart

on:
  release:
    types: [published]

concurrency:
  group: build-images-release-chart
  cancel-in-progress: false

env:
  GHCR_BACKEND_IMAGE: ${{ vars.GHCR_BACKEND_IMAGE }}
  GHCR_FRONTEND_IMAGE: ${{ vars.GHCR_FRONTEND_IMAGE }}
  IMAGE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -f docker/api.Dockerfile \
            -t "${GHCR_BACKEND_IMAGE}:${IMAGE_TAG}" \
            -t "${GHCR_BACKEND_IMAGE}:latest" .
          docker push "${GHCR_BACKEND_IMAGE}:${IMAGE_TAG}"
          docker push "${GHCR_BACKEND_IMAGE}:latest"

      - name: Build and push frontend image
        run: |
          docker build -f docker/frontend.Dockerfile \
            -t "${GHCR_FRONTEND_IMAGE}:${IMAGE_TAG}" \
            -t "${GHCR_FRONTEND_IMAGE}:latest" .
          docker push "${GHCR_FRONTEND_IMAGE}:${IMAGE_TAG}"
          docker push "${GHCR_FRONTEND_IMAGE}:latest"

  release-helm-chart:
    name: Release Helm Chart to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-images
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set chart version and image tags from release tag
        run: |
          VERSION="${IMAGE_TAG#v}"
          sed -i "s/^version:.*/version: ${VERSION}/" helm/chatbot-survey/Chart.yaml
          sed -i "s/^  tag: .*/  tag: \"${VERSION}\"/" helm/chatbot-survey/values.yaml
          echo "Chart version and image tags set to ${VERSION}"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: helm
          charts_repo_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
