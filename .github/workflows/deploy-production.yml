name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'chatbot-survey' }}
  K8S_OVERLAY: ${{ vars.K8S_OVERLAY || 'k8s/overlays/production' }}
  K8S_INGRESS_HOST: ${{ vars.K8S_INGRESS_HOST || 'chatbot-survey.example.com' }}
  GHCR_BACKEND_IMAGE: ${{ vars.GHCR_BACKEND_IMAGE || 'ghcr.io/uiuc-college-of-media/chatbot-survey-backend' }}
  GHCR_FRONTEND_IMAGE: ${{ vars.GHCR_FRONTEND_IMAGE || 'ghcr.io/uiuc-college-of-media/chatbot-survey-frontend' }}
  APP_DATABASE_NAME: ${{ vars.APP_DATABASE_NAME || 'persuasive_ai_study' }}
  APP_ALLOWED_ORIGINS: ${{ vars.APP_ALLOWED_ORIGINS || format('https://{0}', vars.K8S_INGRESS_HOST || 'chatbot-survey.example.com') }}
  AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
  AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  MONGODB_URL: ${{ secrets.MONGODB_URL }}
  AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
  GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
  GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
  TLS_CERT: ${{ secrets.TLS_CERT }}
  TLS_KEY: ${{ secrets.TLS_KEY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -f docker/api.Dockerfile \
            -t "${GHCR_BACKEND_IMAGE}:${IMAGE_TAG}" \
            -t "${GHCR_BACKEND_IMAGE}:latest" .
          docker push "${GHCR_BACKEND_IMAGE}:${IMAGE_TAG}"
          docker push "${GHCR_BACKEND_IMAGE}:latest"

      - name: Build and push frontend image
        run: |
          docker build -f docker/frontend.Dockerfile \
            -t "${GHCR_FRONTEND_IMAGE}:${IMAGE_TAG}" \
            -t "${GHCR_FRONTEND_IMAGE}:latest" .
          docker push "${GHCR_FRONTEND_IMAGE}:${IMAGE_TAG}"
          docker push "${GHCR_FRONTEND_IMAGE}:latest"

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${KUBE_CONFIG}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Ensure namespace exists
        run: |
          kubectl create namespace "${K8S_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

      - name: Create GHCR pull secret (if configured)
        run: |
          kubectl -n "${K8S_NAMESPACE}" create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${GHCR_PULL_USERNAME}" \
            --docker-password="${GHCR_PULL_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create TLS secret (if configured)
        run: |
          printf '%s\n' "${TLS_CERT}" > /tmp/tls.crt
          printf '%s\n' "${TLS_KEY}" > /tmp/tls.key
          kubectl -n "${K8S_NAMESPACE}" create secret tls chatbot-survey-tls \
            --cert=/tmp/tls.crt \
            --key=/tmp/tls.key \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Render production env files
        run: |
          mkdir -p k8s/overlays/production/config k8s/overlays/production/secrets

          cat > k8s/overlays/production/config/backend.production.env <<EOF
          APP_ENV=production
          DATABASE_NAME=${APP_DATABASE_NAME}
          AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
          AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}
          ALLOWED_ORIGINS=${APP_ALLOWED_ORIGINS}
          EOF

          cat > k8s/overlays/production/secrets/backend.production.env <<EOF
          AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
          MONGODB_URL=${MONGODB_URL}
          EOF

      - name: Pin image tags and ingress host
        run: |
          sed -i.bak "s|^\\(\\s*image: \\).*chatbot-survey-backend:.*$|\\1${GHCR_BACKEND_IMAGE}:${IMAGE_TAG}|g" \
            k8s/overlays/production/backend-deployment-patch.yaml
          sed -i.bak "s|^\\(\\s*image: \\).*chatbot-survey-frontend:.*$|\\1${GHCR_FRONTEND_IMAGE}:${IMAGE_TAG}|g" \
            k8s/overlays/production/frontend-deployment-patch.yaml
          sed -i.bak "s|chatbot-survey.example.com|${K8S_INGRESS_HOST}|g" \
            k8s/overlays/production/ingress.yaml
          rm -f k8s/overlays/production/*.bak

      - name: Render manifests
        run: kubectl kustomize "${K8S_OVERLAY}" >/tmp/k8s-rendered.yaml

      - name: Deploy overlay
        run: |
          kubectl apply -k "${K8S_OVERLAY}"
          kubectl -n "${K8S_NAMESPACE}" rollout status deploy/backend --timeout=300s
          kubectl -n "${K8S_NAMESPACE}" rollout status deploy/frontend --timeout=300s
